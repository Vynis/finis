services:
  # -----------------------------------------------------------
  # 1. Backend - Finis API (.NET 9)
  # -----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finis_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Server=${DB_HOST:-host.docker.internal};Port=${DB_PORT:-3306};Database=${DB_NAME:-finis_db};User=${DB_USER:-root};Password=${DB_PASSWORD:-@vs130986};CharSet=utf8mb4;
      Jwt__Key: FinisSecureSuperSecretKey2026!FinisFinancialCashflowTermometroLongSecretKey
      Jwt__Issuer: FinisApi
      Jwt__Audience: FinisApp
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  # -----------------------------------------------------------
  # 2. Frontend - Finis Web App (Angular 16 + Nginx)
  # -----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finis_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4201}:80"
    depends_on:
      - backend
