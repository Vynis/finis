<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-md-8 col-lg-5 col-xl-4">
      <div class="card card-finis p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="rounded-circle bg-success text-white d-inline-flex align-items-center justify-content-center mb-2 shadow" style="width: 56px; height: 56px;">
            <i class="bi bi-graph-up-arrow fs-3"></i>
          </div>
          <h3 class="fw-bold text-dark mb-1">finis</h3>
          <p class="text-muted small">Termômetro & Controle Financeiro Diário</p>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger py-2 small d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">E-mail</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="seu@email.com" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Senha</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" [(ngModel)]="password" name="password" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-pill shadow-sm" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            <span>Entrar no Finis</span>
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="text-muted small mb-0">
            Ainda não tem conta?
            <a routerLink="/register" class="text-success fw-semibold text-decoration-none">Cadastre-se</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
