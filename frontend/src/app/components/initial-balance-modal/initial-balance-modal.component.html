<div class="modal fade show d-block" tabindex="-1" *ngIf="isOpen" style="background-color: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px);">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content card-finis border-0 shadow-lg">
      <div class="modal-header border-bottom py-3 px-4">
        <h5 class="modal-title fw-bold text-dark d-flex align-items-center gap-2">
          <i class="bi bi-wallet2 text-success"></i>
          <span>Saldo Inicial</span>
        </h5>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <p class="text-muted small mb-3">
          Este valor é o ponto de partida do seu <strong>Termômetro Financeiro</strong>. Todas as movimentações calculam o saldo diário contínuo a partir dele.
        </p>

        <div *ngIf="errorMessage" class="alert alert-danger py-2 small">
          {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSubmit()">
          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Novo Saldo Inicial (R$)</label>
            <div class="input-group">
              <span class="input-group-text bg-white fw-bold text-success">R$</span>
              <input type="number" step="0.01" class="form-control mono-num fw-bold fs-5 text-dark" [(ngModel)]="balance" name="balance" required autofocus>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-light rounded-pill px-3" (click)="closeModal()" [disabled]="loading">
              Cancelar
            </button>
            <button type="submit" class="btn btn-success rounded-pill px-4 fw-semibold shadow-sm" [disabled]="loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              <span>Salvar</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
